<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON TECH — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-row">
    <img class="mark" src="img/logo_neon.png" alt="Logo NEON TECH">
    <div class="header-text">
      <div class="brand"><span class="neon">NEON</span> <span class="tech">TECH</span></div>
      <div class="tagline">Technology Products</div>
    </div>
  </div>
  <div class="divider"></div>
</header>

<main>
  <div class="section-label">Catálogo</div>
  <div class="grid" id="grid"></div>
</main>

<a class="float-wa" id="floatWa" href="#" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.14c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.15.07.15.12.32.02.51-.1.19-.15.31-.3.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.75 1.24 1.62 2.01 1.11.99 2.04 1.3 2.33 1.45.29.15.46.13.63-.08.17-.2.72-.84.92-1.13.19-.29.39-.24.65-.14.27.1 1.68.79 1.97.94.29.14.48.21.55.33.07.12.07.68-.17 1.36z"/></svg>
  Consultar por WhatsApp
</a>

<footer>© NEON TECH — Catálogo de tecnología</footer>

<!-- ===== LIGHTBOX: recuadro que muestra la imagen ampliada al hacer clic ===== -->
<div id="lightbox-overlay" class="lightbox-overlay">
  <span class="lightbox-close" id="lightboxClose" aria-label="Cerrar">&times;</span>
  <button type="button" class="lightbox-nav prev" id="lightboxPrev" aria-label="Imagen anterior">‹</button>
  <img id="lightbox-img" class="lightbox-img" src="" alt="Vista ampliada del producto">
  <button type="button" class="lightbox-nav next" id="lightboxNext" aria-label="Imagen siguiente">›</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<script>
  // ⚠️ Cambia este número por el real (indicativo de país + número, sin espacios ni signos)
  const NUMERO_WHATSAPP = "573102598307";

  // Reemplaza este arreglo con tu listado real: nombre, precio, especificaciones e icono
  const productos = [
   {
      nombre: "AirpodMax 1.1 Pro imantada",
      precio: "105.000",
      specs: "Bluetooth 5.0 · Controla tu música, haz llamadas · Hasta 4h de reproducción · Cable Tipo USB-C incluido · Alcance de Bluetooth: 10 m · Cancelación activa de ruido (ANC)",
      imagenes:["img/colores.jpg", "img/Blanco1.jpg", "img/lila.jpg", "img/champagne.jpg", "img/Negros.jpg", "img/conexion.png"],
      icono: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="2" y="13" width="4" height="7" rx="1.5"/><rect x="18" y="13" width="4" height="7" rx="1.5"/></svg>`
    },
    {
      nombre: "Airpods Pro 2",
      precio: "70000",
      imagenes:["img/pro2.jpg", "img/pro.jpg", "img/pro2.3.jpeg"],
      specs: "Cancelación de ruido · Control táctil para ajustar el volumen, reproducir o pausar · Duración aproximada de 3 a 5 horas · Conexión automática con solo abrir la tapa del estuche · Cable Tipo USB-C incluido",
      icono: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="2"/><circle cx="12" cy="18" r="0.6" fill="currentColor"/></svg>`
    },
    {
      nombre: "Airpods Pro 3",
      precio: "90000",
      specs: "Cancelación de ruido activa · Compatibilidad total con iOS y Android · Duración de batería (auriculares): 3–5 horas · Ajuste personalizado con cinco tamaños de almohadillas · Diseño del audifono mas pequeño",
      imagenes:["img/pro3.3.jpg", "img/pro3.1.jpg", "img/pro3.2.jpg"],
      icono: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="2" y="13" width="4" height="7" rx="1.5"/><rect x="18" y="13" width="4" height="7" rx="1.5"/></svg>`
    },
    {
      nombre: "Airpods Pro 4",
      precio: "70000",
      specs: "Batería de larga duración Hasta 3-5 horas · Compatible con dispositivos iOS y Android · Control táctil para volumen y reproducción · Diseño cómodo y práctico para uso prolongado · Modo manos libres con micrófono incorporado.",
      imagenes:["img/pro4.jpg", "img/pro4.1.jpg", "img/pro4.2.jpg"],
      icono: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="6" width="10" height="12" rx="2"/><path d="M9 3h6M9 21h6" stroke-linecap="round"/></svg>`
    },
    {
      nombre: "Power bank",
      precio: "50000",
      specs: " 12000 mAh · Indicador de carga pantalla digital · Doble puerto de carga USB · Entrega entre 2 y 2.5 cargas para un celular · Proteccion de seguridad de sobrecargas · Carga simultanea hasta dos dispositivos a la vez ",
      imagenes:["img/power.jpeg"],
      icono: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="8" width="20" height="10" rx="4"/><circle cx="8" cy="13" r="1.3" fill="currentColor"/><circle cx="17" cy="11.5" r="1" fill="currentColor"/><circle cx="18.5" cy="14" r="1" fill="currentColor"/></svg>`
    },
    {
      nombre: "Combo Teclado - Mouse",
      precio: "80000",
      specs: "Teclado de membrana con switch óptico. · Mouse con sensor óptico · Recargable con puerto Tipo C · Ahorro de Energía Inteligente",
      imagenes:["img/teclado1.jpg", "img/tecla.jpg", "img/mouse.jpg", "img/vista.jpg"],
      icono: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="20" height="13" rx="2"/><circle cx="12" cy="13.5" r="4"/><path d="M8 7l1.5-3h5L16 7"/></svg>`
    },
    {
      nombre: "Reloj inteligente",
      precio: "75000",
      specs: "Certificación IPX7 lo hace resistente al agua · Conectividad por bluetooth · Batería de 2 días de duración · Duración de la batería: 2 días " ,
      imagenes:["img/reloj.jpeg", "img/reloj2.jpeg", "img/reloj3.jpeg", "img/reloj4.webp"], 
      icono: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="20" height="13" rx="2"/><circle cx="12" cy="13.5" r="4"/><path d="M8 7l1.5-3h5L16 7"/></svg>`
    },
    
  ];

  const iconWA = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.14c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.15.07.15.12.32.02.51-.1.19-.15.31-.3.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.75 1.24 1.62 2.01 1.11.99 2.04 1.3 2.33 1.45.29.15.46.13.63-.08.17-.2.72-.84.92-1.13.19-.29.39-.24.65-.14.27.1 1.68.79 1.97.94.29.14.48.21.55.33.07.12.07.68-.17 1.36z"/></svg>`;

  function mensajeWA(nombreProducto) {
    return `Hola, quisiera más información sobre: ${nombreProducto}`;
  }

  const grid = document.getElementById("grid");

  // Arma el contenido visual de cada tarjeta: carrusel de fotos, una sola foto, o ícono
  function renderVisual(p) {
    // Lista unificada de fotos del producto (viene de "imagenes" o de "imagen"), usada también por el lightbox
    const fotos = (p.imagenes && p.imagenes.length) ? p.imagenes : (p.imagen ? [p.imagen] : null);
    // Se guarda como atributo data-images en JSON, así el lightbox sabe entre qué fotos navegar
    const dataImagenes = fotos ? ` data-images='${JSON.stringify(fotos)}'` : '';

    if (fotos && fotos.length > 1) {
      // Varias imágenes: arma el carrusel con flechas y puntos indicadores
      return `
        <div class="card-icon carousel"${dataImagenes}>
          <div class="carousel-track">
            ${fotos.map(img => `<img src="${img}" alt="${p.nombre}">`).join('')}
          </div>
          <button type="button" class="carousel-btn prev" aria-label="Imagen anterior">‹</button>
          <button type="button" class="carousel-btn next" aria-label="Imagen siguiente">›</button>
          <div class="carousel-dots">
            ${fotos.map((_, i) => `<span class="dot${i === 0 ? ' active' : ''}"></span>`).join('')}
          </div>
        </div>`;
    }
    if (fotos && fotos.length === 1) {
      // Una sola imagen (venga de "imagenes" o de "imagen")
      return `<div class="card-icon"${dataImagenes}><img src="${fotos[0]}" alt="${p.nombre}"></div>`;
    }
    // Producto sin fotos: usa el ícono SVG genérico
    return `<div class="card-icon">${p.icono}</div>`;
  }

  grid.innerHTML = productos.map(p => `
    <div class="card">
      ${renderVisual(p)}
      <h3>${p.nombre}</h3>
      <ul class="specs">
        ${p.specs.split("·").map(item => item.trim()).filter(item => item).map(item => `<li>${item}</li>`).join("")}
      </ul>
      <div class="price">$${p.precio}<small>COP</small></div>
      <a class="btn-wa" href="https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensajeWA(p.nombre))}" target="_blank" rel="noopener">
        ${iconWA} Consultar
      </a>
    </div>
  `).join("");

  document.getElementById("floatWa").href =
    `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent("Hola, quisiera información sobre sus productos NEON TECH")}`;

  // Mueve un carrusel de imágenes hacia adelante (1) o hacia atrás (-1)
  function moverCarrusel(carousel, direccion) {
    const track = carousel.querySelector(".carousel-track");
    const dots = carousel.querySelectorAll(".dot");
    const total = dots.length;
    let actual = parseInt(carousel.dataset.actual || "0", 10);
    actual = (actual + direccion + total) % total; // vuelve al inicio/final en los extremos
    carousel.dataset.actual = actual;
    track.style.transform = `translateX(-${actual * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle("active", i === actual));
  }

  // Escucha clics en toda la cuadrícula y detecta si fue sobre una flecha de carrusel
  grid.addEventListener("click", function (e) {
    const boton = e.target.closest(".carousel-btn");
    if (!boton) return;
    const carousel = boton.closest(".carousel");
    moverCarrusel(carousel, boton.classList.contains("next") ? 1 : -1);
  });

  // ===== LIGHTBOX: ampliar imagen al hacer clic, con navegación entre fotos =====
  const lightboxOverlay = document.getElementById("lightbox-overlay");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxClose = document.getElementById("lightboxClose");
  const lightboxPrev = document.getElementById("lightboxPrev");
  const lightboxNext = document.getElementById("lightboxNext");
  const lightboxCounter = document.getElementById("lightboxCounter");

  let lightboxFotos = [];   // Todas las fotos del producto actualmente abierto
  let lightboxIndice = 0;   // Foto que se está mostrando en este momento
  let lightboxAlt = "";     // Texto alternativo (nombre del producto)

  // Pinta en pantalla la foto correspondiente al índice actual
  function pintarLightbox() {
    lightboxImg.src = lightboxFotos[lightboxIndice];
    lightboxImg.alt = lightboxAlt;
    const varias = lightboxFotos.length > 1;
    // Las flechas y el contador solo se muestran si el producto tiene más de una foto
    lightboxPrev.style.display = varias ? "flex" : "none";
    lightboxNext.style.display = varias ? "flex" : "none";
    lightboxCounter.style.display = varias ? "block" : "none";
    lightboxCounter.textContent = `${lightboxIndice + 1} / ${lightboxFotos.length}`;
  }

  function abrirLightbox(fotos, indiceInicial, alt) {
    lightboxFotos = fotos;
    lightboxIndice = indiceInicial;
    lightboxAlt = alt || "Vista ampliada del producto";
    pintarLightbox();
    lightboxOverlay.classList.add("active");
  }

  function cerrarLightbox() {
    lightboxOverlay.classList.remove("active");
    lightboxImg.src = ""; // libera memoria de la imagen mientras está cerrado
  }

  // Avanza (1) o retrocede (-1) entre las fotos del producto abierto en el lightbox
  function moverLightbox(direccion) {
    if (lightboxFotos.length < 2) return;
    lightboxIndice = (lightboxIndice + direccion + lightboxFotos.length) % lightboxFotos.length;
    pintarLightbox();
  }

  // Detecta clics sobre cualquier foto de producto dentro de la cuadrícula
  // (funciona tanto para el carrusel como para la foto única), sin interferir
  // con los clics sobre las flechas ‹ › del carrusel.
  grid.addEventListener("click", function (e) {
    if (e.target.closest(".carousel-btn")) return; // ya lo maneja el listener de arriba
    const img = e.target.closest(".card-icon img");
    if (!img) return;
    const contenedor = img.closest(".card-icon");
    const fotos = JSON.parse(contenedor.dataset.images || "[]");
    // Busca en qué posición de la lista está la foto que se clicó (para abrir el lightbox justo en esa)
    let indice = fotos.indexOf(img.getAttribute("src"));
    if (indice === -1) indice = 0;
    abrirLightbox(fotos, indice, img.alt);
  });

  lightboxClose.addEventListener("click", cerrarLightbox);
  lightboxPrev.addEventListener("click", () => moverLightbox(-1));
  lightboxNext.addEventListener("click", () => moverLightbox(1));

  lightboxOverlay.addEventListener("click", function (e) {
    if (e.target === lightboxOverlay) cerrarLightbox(); // clic fuera de la imagen, no sobre ella
  });

  document.addEventListener("keydown", function (e) {
    if (!lightboxOverlay.classList.contains("active")) return; // solo si el lightbox está abierto
    if (e.key === "Escape") cerrarLightbox();
    if (e.key === "ArrowRight") moverLightbox(1);
    if (e.key === "ArrowLeft") moverLightbox(-1);
  });

  // Deslizar con el dedo (swipe) en pantallas táctiles para pasar de foto
  let swipeInicioX = null;
  lightboxImg.addEventListener("touchstart", (e) => {
    swipeInicioX = e.touches[0].clientX;
  });
  lightboxImg.addEventListener("touchend", (e) => {
    if (swipeInicioX === null) return;
    const diferencia = e.changedTouches[0].clientX - swipeInicioX;
    if (Math.abs(diferencia) > 40) moverLightbox(diferencia > 0 ? -1 : 1);
    swipeInicioX = null;
  });
</script>

</body>
</html>
